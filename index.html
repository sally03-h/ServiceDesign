<title>Common Coffee Ecosystem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">

<style>
:root{
  /* cool stone chrome */
  --chrome:#E9ECEA; --chrome-2:#E0E4E1; --chrome-3:#D4D9D6;
  --ink:#2C3133; --ink-2:#5E686A; --ink-3:#8B9597;
  --rule:#CBD1CE; --rule-soft:#DCE1DE;
  /* cement wall stage */
  --stage:#F1F2F0; --stage-2:#E3E5E2; --stage-rim:#CDD2CF;
  --stage-ink:#333A3C; --stage-ink-2:#68716F; --stage-ink-3:#98A19F;
  /* the one warm note: the table lights */
  --brass:#B5822C; --brass-deep:#8A611C; --brass-wash:rgba(181,130,44,.13);
  /* actor hues — desaturated, cool-leaning */
  --c-org:#39464A; --c-customer:#7CA8A2; --c-staff:#C58B7C;
  --c-artifact:#B3AB88; --c-channel:#8B9BA8; --c-institution:#A3AAA4;
  /* exchange lines */
  --e-formal:#AFB5B2; --e-both:#798385; --e-observed:#B5822C;
  --shadow:0 1px 2px rgba(44,49,51,.06), 0 10px 30px rgba(44,49,51,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#1B1F20; --chrome-2:#232829; --chrome-3:#2C3234;
    --ink:#E4E8E7; --ink-2:#A8B1B1; --ink-3:#788283;
    --rule:#343A3B; --rule-soft:#282D2E;
    --stage:#272B2C; --stage-2:#1F2324; --stage-rim:#3D4443;
    --stage-ink:#DDE2E1; --stage-ink-2:#8E9899; --stage-ink-3:#616A6B;
    --e-formal:#565E5F; --e-both:#98A2A3; --e-observed:#D39A3E;
    --brass:#D39A3E; --brass-deep:#E0AE58; --brass-wash:rgba(211,154,62,.16);
    --c-org:#C3CFD2; --c-customer:#7CB0A9; --c-staff:#CF9384;
    --c-artifact:#BEB68F; --c-channel:#93A4B2; --c-institution:#8E9791;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --chrome:#1B1F20; --chrome-2:#232829; --chrome-3:#2C3234;
  --ink:#E4E8E7; --ink-2:#A8B1B1; --ink-3:#788283;
  --rule:#343A3B; --rule-soft:#282D2E;
  --stage:#272B2C; --stage-2:#1F2324; --stage-rim:#3D4443;
  --stage-ink:#DDE2E1; --stage-ink-2:#8E9899; --stage-ink-3:#616A6B;
  --e-formal:#565E5F; --e-both:#98A2A3; --e-observed:#D39A3E;
  --brass:#D39A3E; --brass-deep:#E0AE58; --brass-wash:rgba(211,154,62,.16);
  --c-org:#C3CFD2; --c-customer:#7CB0A9; --c-staff:#CF9384;
  --c-artifact:#BEB68F; --c-channel:#93A4B2; --c-institution:#8E9791;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.38);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--chrome); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:3px}

.app{display:flex; flex-direction:column; height:100%; min-height:0}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:12px 20px; border-bottom:1px solid var(--rule); background:var(--chrome);
}
.brand h1{font-size:18px; letter-spacing:-.015em; font-weight:500}
.brand .sub{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-top:2px;
}
.topbar-actions{display:flex; gap:8px; margin-left:auto}
.iconbtn{
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center; flex:none;
  border:1px solid var(--rule); background:var(--chrome-2); color:var(--ink-2);
  transition:background .15s, color .15s;
}
.iconbtn:hover{background:var(--chrome-3); color:var(--ink)}
.iconbtn svg{width:17px; height:17px; display:block}

/* ---------- body ---------- */
.body{display:flex; flex:1; min-height:0}

.rail{
  width:244px; flex:none; overflow-y:auto; overflow-x:hidden; padding:16px 15px 40px;
  border-right:1px solid var(--rule); background:var(--chrome);
}
.grp{margin-bottom:20px}
.grp-h{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9.5px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px;
  display:flex; justify-content:space-between; align-items:baseline;
}
.seg{display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden}
.seg button{
  flex:1; padding:6px 3px; font-size:11px; letter-spacing:.005em; color:var(--ink-2);
  background:var(--chrome-2); border-right:1px solid var(--rule); transition:background .15s,color .15s;
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--chrome); font-weight:500}
.seg button:hover:not([aria-pressed="true"]){background:var(--chrome-3)}

.chips{display:flex; flex-wrap:wrap; gap:4px}
.chip{
  display:flex; align-items:center; gap:5px; border:1px solid var(--rule); border-radius:999px;
  padding:3px 10px 3px 6px; font-size:11px; color:var(--ink-2);
  background:var(--chrome-2); transition:opacity .15s;
}
.chip .sw{width:14px; height:14px; border-radius:50%; flex:none; background:var(--sw);
  display:grid; place-items:center; color:var(--chrome)}
.chip .sw svg{width:9px; height:9px}
.chip[aria-pressed="false"]{opacity:.36}
.chip[aria-pressed="true"]{color:var(--ink); border-color:var(--ink-3)}

.list{display:flex; flex-direction:column; gap:1px}
.list button{
  display:flex; gap:8px; align-items:flex-start; text-align:left;
  padding:7px 10px; border-radius:10px; font-size:12px; line-height:1.35;
  color:var(--ink-2); transition:background .15s;
}
.list button:hover{background:var(--chrome-2); color:var(--ink)}
.list button[aria-pressed="true"]{background:var(--brass-wash); color:var(--ink)}
.list .tag{
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--brass-deep);
  padding-top:1.5px; flex:none; font-weight:500;
}
.list button[aria-pressed="true"] .tag{color:var(--ink)}
.persona-btn .pname{display:block; font-weight:500; color:var(--ink)}
.persona-btn .pmeta{display:block; font-size:10.5px; color:var(--ink-3); margin-top:1px}
.strength{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  letter-spacing:.04em; text-transform:uppercase; padding:1px 6px; border-radius:999px;
  border:1px solid currentColor; margin-left:5px; vertical-align:1px;
}
.s-moderate{color:#6E8A72} .s-thin{color:#B07A3B}

/* ---------- stage ---------- */
.stage{
  flex:1; min-width:0; min-height:0; position:relative;
  background:var(--stage); overflow:hidden;
}
/* absolutely filled rather than flex-centred: no sub-pixel seam at the top */
#map{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#map.grabbing{cursor:grabbing}
.stage-empty{
  position:absolute; inset:0; display:grid; place-items:center;
  color:var(--stage-ink-3); font-size:13px; pointer-events:none; opacity:0; transition:opacity .3s;
}

/* permanent map key — stays put whatever is selected */
.maplegend{
  position:absolute; left:14px; bottom:14px; z-index:3;
  display:flex; flex-wrap:wrap; align-items:center; gap:7px 13px;
  background:color-mix(in srgb, var(--stage) 86%, transparent);
  border:1px solid var(--stage-rim); border-radius:14px; padding:8px 14px;
  -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
  font-size:10.5px; color:var(--stage-ink-2);
  max-width:min(600px, calc(100% - 110px));
}
.mlrow{display:flex; align-items:center; gap:6px; white-space:nowrap}
.mlrow svg{flex:none}
.mlsep{width:1px; height:13px; background:var(--stage-rim); flex:none}

.zoomctl{position:absolute; right:14px; bottom:14px; z-index:3; display:flex; flex-direction:column; gap:7px}
.stage .iconbtn{
  width:33px; height:33px; border-color:var(--stage-rim); color:var(--stage-ink-2);
  background:color-mix(in srgb, var(--stage) 88%, transparent);
  -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
}
.stage .iconbtn:hover{background:var(--stage-2); color:var(--stage-ink)}
.stage .iconbtn svg{width:16px; height:16px}

/* Cement wall: its own stretched layer, so the grain stays a constant
   physical size and always covers the stage whatever its shape. */
.wall{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  pointer-events:none; isolation:isolate; background:var(--stage);
}
.tex{mix-blend-mode:multiply}
.tex-patch{opacity:.17}
.tex-mottle{opacity:.085}
.tex-pit{opacity:.28}
/* dark concrete is smoother: the broad stain carries it, the pitting all but
   disappears — speckle on a dark ground just reads as dirt. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tex{mix-blend-mode:soft-light}
  :root:not([data-theme="light"]) .tex-patch{opacity:.42}
  :root:not([data-theme="light"]) .tex-mottle{opacity:.10}
  :root:not([data-theme="light"]) .tex-pit{opacity:.05}
}
:root[data-theme="dark"] .tex{mix-blend-mode:soft-light}
:root[data-theme="dark"] .tex-patch{opacity:.42}
:root[data-theme="dark"] .tex-mottle{opacity:.10}
:root[data-theme="dark"] .tex-pit{opacity:.05}

/* SVG internals */
.halo-label{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.16em;
  fill:var(--stage-ink-3); text-anchor:middle; pointer-events:none; text-transform:uppercase;
}
.edge{transition:opacity .4s ease}
.edge-line{fill:none; transition:stroke-width .2s}
.edge-hit{fill:none; stroke:transparent; stroke-width:15px; cursor:pointer}
.node{transition:opacity .4s ease; cursor:pointer}
.node-dot{transition:r .2s, stroke-width .2s}
.node-icon{pointer-events:none}
.node-label{
  font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:500; fill:var(--stage-ink);
  text-anchor:middle; paint-order:stroke; stroke:var(--stage); stroke-width:3.4px;
  stroke-linejoin:round; pointer-events:none; letter-spacing:.005em;
}
.node.is-org .node-label{font-size:13.5px; font-weight:600; letter-spacing:.02em}
.node.is-institution .node-label{font-size:9.5px; fill:var(--stage-ink-2)}
.contra-badge{cursor:pointer}
.contra-badge text{
  font-family:"IBM Plex Mono",monospace; font-size:8.5px; font-weight:500;
  fill:var(--stage); text-anchor:middle; pointer-events:none;
}
.dimmed{opacity:.08}
.faded{opacity:.26}
.hidden-el{opacity:0; pointer-events:none}

/* ---------- panel ---------- */
.panel{
  width:376px; flex:none; overflow-y:auto; overflow-x:hidden; background:var(--chrome);
  border-left:1px solid var(--rule); padding:18px 18px 48px; position:relative;
}
.panel-kicker{
  display:flex; align-items:center; gap:7px; margin-bottom:6px;
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3);
}
.panel-kicker .sw{width:17px; height:17px; border-radius:50%; flex:none; display:grid;
  place-items:center; color:var(--chrome)}
.panel-kicker .sw svg{width:11px; height:11px}
.panel h2{font-size:18px; letter-spacing:-.01em; line-height:1.25; margin-bottom:8px; font-weight:500}
.panel-lede{font-size:13px; color:var(--ink-2); line-height:1.55}
.panel-close{position:absolute; top:12px; right:14px; width:28px; height:28px}
.panel-close svg{width:14px; height:14px}

.meta{
  display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:14px 0; padding:11px 0;
  border-top:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft); font-size:12px;
}
.meta dt{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); padding-top:2px;
}
.meta dd{margin:0; color:var(--ink)}

.sec{margin-top:18px}
.sec-h{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:7px;
}
.link-list{display:flex; flex-direction:column; gap:2px}
.link-list button{
  text-align:left; font-size:12.5px; color:var(--ink-2); line-height:1.4;
  padding:5px 9px; border-radius:10px; display:flex; gap:8px; align-items:flex-start;
}
.link-list button:hover{background:var(--chrome-2); color:var(--ink)}
.link-list .gl{flex:none; width:15px; height:15px; margin-top:1px; color:var(--ink-3)}
.link-list .gl svg{width:15px; height:15px; display:block}

.constraint{
  background:var(--chrome-2); border-left:2px solid var(--c-staff);
  padding:9px 12px; font-size:12.5px; color:var(--ink-2); line-height:1.5; border-radius:0 12px 12px 0;
}
.contra-note{
  background:var(--brass-wash); border-left:2px solid var(--brass);
  padding:10px 12px; border-radius:0 12px 12px 0;
}
.contra-note .cn-h{font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:3px}
.contra-note p{font-size:12.5px; color:var(--ink-2); line-height:1.5}

.ev{border-top:1px solid var(--rule-soft)}
.ev summary{list-style:none; cursor:pointer; padding:7px 0 7px 2px; display:flex; align-items:baseline; gap:9px; font-size:12px}
.ev summary::-webkit-details-marker{display:none}
.ev summary:hover .ev-id{color:var(--ink)}
.ev-id{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; color:var(--ink-2); flex:none; min-width:66px}
.ev-what{color:var(--ink-3); flex:1; line-height:1.4}
.ev-body{padding:0 2px 12px 75px}
.ev-quote{font-family:"Newsreader",Georgia,serif; font-size:15px; line-height:1.5; color:var(--ink); font-style:italic}
.ev-src{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); margin-top:6px; letter-spacing:.02em}

.empty-panel{color:var(--ink-3); font-size:13px; line-height:1.6}
.empty-panel .eh{color:var(--ink); font-weight:600; font-size:14px; margin-bottom:6px}
.caveat{margin-top:24px; padding-top:12px; border-top:1px solid var(--rule-soft); font-size:11.5px; color:var(--ink-3); line-height:1.5}

@media (max-width:1180px){
  .panel{position:absolute; right:0; top:0; bottom:0; z-index:5; box-shadow:var(--shadow); width:348px}
  .body{position:relative}
}
@media (max-width:860px){
  .body{flex-direction:column}
  .rail{width:auto; border-right:none; border-bottom:1px solid var(--rule); max-height:196px;
    padding:12px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:0 20px}
  .grp{margin-bottom:14px}
  .stage{min-height:400px}
  .panel{width:100%; max-width:none}
  .maplegend{left:10px; bottom:10px; padding:6px 10px; gap:5px 10px; font-size:9.5px;
    max-width:calc(100% - 66px); border-radius:11px}
  .zoomctl{right:10px; bottom:10px; gap:5px}
  .stage .iconbtn{width:29px; height:29px}
  .stage .iconbtn svg{width:14px; height:14px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Common Coffee &amp; Cocktails</h1>
      <p class="sub">Service ecosystem · Doraville GA · Team 7 · D1</p>
    </div>
    <div class="topbar-actions">
      <button class="iconbtn" id="resetBtn" title="Reset filters and view" aria-label="Reset filters and view"></button>
      <button class="iconbtn" id="themeBtn" title="Switch light or dark" aria-label="Switch light or dark"></button>
    </div>
  </header>

  <div class="body">
    <aside class="rail">
      <div class="grp">
        <div class="grp-h">System view</div>
        <div class="seg" id="modeSeg" role="group" aria-label="System view">
          <button data-mode="both" aria-pressed="true">Both</button>
          <button data-mode="formal" aria-pressed="false">Published</button>
          <button data-mode="observed" aria-pressed="false">Observed</button>
        </div>
      </div>
      <div class="grp">
        <div class="grp-h">Time of day</div>
        <div class="seg" id="timeSeg" role="group" aria-label="Time of day">
          <button data-time="all" aria-pressed="true">All</button>
          <button data-time="day" aria-pressed="false">Day</button>
          <button data-time="evening" aria-pressed="false">Evening</button>
        </div>
      </div>
      <div class="grp">
        <div class="grp-h">Actor types</div>
        <div class="chips" id="typeChips"></div>
      </div>
      <div class="grp">
        <div class="grp-h"><span>Published vs observed</span><span style="color:var(--brass-deep);font-weight:500">7</span></div>
        <div class="list" id="contraList"></div>
      </div>
      <div class="grp">
        <div class="grp-h">Personas</div>
        <div class="list" id="personaList"></div>
        <p style="font-size:10.5px;color:var(--ink-3);margin-top:8px;line-height:1.45">
          Placeholder set. Replace <code style="font-family:'IBM Plex Mono',monospace;font-size:10px">PERSONAS</code> in the source.
        </p>
      </div>
    </aside>

    <main class="stage">
      <svg class="wall" id="wall" aria-hidden="true"></svg>
      <svg id="map" viewBox="0 0 1240 920" preserveAspectRatio="xMidYMid meet" role="img"
        aria-label="Interactive ecosystem map of Common Coffee and Cocktails, showing actors, exchanges, and the gaps between the published service system and the one observed in fieldwork."></svg>
      <div class="stage-empty" id="stageEmpty">No actors match these filters.</div>

      <div class="maplegend">
        <div class="mlrow"><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="var(--e-formal)" stroke-width="1.3" stroke-dasharray="4.5 4"/></svg>Published</div>
        <div class="mlrow"><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="var(--e-both)" stroke-width="1.3"/></svg>Both</div>
        <div class="mlrow"><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="var(--e-observed)" stroke-width="1.9"/></svg>Observed</div>
        <span class="mlsep"></span>
        <div class="mlrow"><svg width="24" height="8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--e-both)" stroke-width="3"/></svg>Value</div>
        <div class="mlrow"><svg width="24" height="8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--e-both)" stroke-width="1"/></svg>Information</div>
        <span class="mlsep"></span>
        <div class="mlrow"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 11.2 6 6 11.2.8 6Z" fill="var(--brass)"/></svg>Gap</div>
      </div>

      <div class="zoomctl">
        <button class="iconbtn" id="zoomIn" title="Zoom in" aria-label="Zoom in"></button>
        <button class="iconbtn" id="zoomOut" title="Zoom out" aria-label="Zoom out"></button>
        <button class="iconbtn" id="zoomFit" title="Fit map to view" aria-label="Fit map to view"></button>
      </div>
    </main>

    <aside class="panel" id="panel"><div id="panelBody"></div></aside>
  </div>
</div>

<script>
"use strict";

/* ============================================================================
   ICON SET — 24×24, stroke-based, drawn to match the thin-line reference style
   ==========================================================================*/
const ICONS = {
  speech:'<path d="M3 6.5A2 2 0 0 1 5 4.5h8a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8l-3 2.5V12.5H5a2 2 0 0 1-2-2Z"/><path d="M9 16.5h6l3 2.5V17h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-1"/>',
  browser:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M6 7h.01M8.5 7h.01"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  star:'<path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.85Z"/>',
  guide:'<path d="M3 5.5h6a3 3 0 0 1 3 3v10a2.4 2.4 0 0 0-2.4-2.4H3Z"/><path d="M21 5.5h-6a3 3 0 0 0-3 3v10a2.4 2.4 0 0 1 2.4-2.4H21Z"/>',

const defs=el("defs",{},svg);

/* Cement wall, built in three layers: broad patchy staining, a medium
   trowelled mottle, and the fine dark pitting you get in poured concrete. */
function greyNoise(id,freq,octaves,seed){
  const f=el("filter",{id,x:"0",y:"0",width:"100%",height:"100%"},defs);
  el("feTurbulence",{type:"fractalNoise",baseFrequency:freq,numOctaves:octaves,seed,result:"n"},f);
  el("feColorMatrix",{in:"n",type:"saturate",values:"0",result:"g"},f);
  const ct=el("feComponentTransfer",{in:"g"},f);
  el("feFuncA",{type:"linear",slope:"0",intercept:"1"},ct);
  return f;
}
greyNoise("fPatch","0.0055",4,"21");   // broad staining
greyNoise("fMottle","0.03",3,"7");     // trowel texture
// fine pitting: threshold high-frequency noise so only a fraction goes dark
const fPit=el("filter",{id:"fPit",x:"0",y:"0",width:"100%",height:"100%"},defs);
el("feTurbulence",{type:"fractalNoise",baseFrequency:"0.7",numOctaves:"1",seed:"3",result:"n"},fPit);
el("feColorMatrix",{in:"n",type:"saturate",values:"0",result:"g"},fPit);
const pitCT=el("feComponentTransfer",{in:"g"},fPit);
["feFuncR","feFuncG","feFuncB"].forEach(fn=>el(fn,{type:"discrete",tableValues:"0.34 1 1 1 1 1 1 1 1 1"},pitCT));

const degree={};
EXCHANGES.forEach(e=>{degree[e.from]=(degree[e.from]||0)+1; degree[e.to]=(degree[e.to]||0)+1;});
function radiusOf(a){ return a.r || (15 + Math.min(degree[a.id]||0,9)*0.62); }

/* --- curvature: spread parallel exchanges between the same pair --- */
const pairCount={}, pairIndex={};
EXCHANGES.forEach(e=>{const k=[e.from,e.to].sort().join("|"); pairCount[k]=(pairCount[k]||0)+1;});
EXCHANGES.forEach(e=>{const k=[e.from,e.to].sort().join("|"); pairIndex[e.id]=(pairIndex[k]=(pairIndex[k]??-1)+1);});

function geom(e){
  const a=byId[e.from], b=byId[e.to];
  const ra=radiusOf(a)+4, rb=radiusOf(b)+8;
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  const x1=a.x+ux*ra, y1=a.y+uy*ra, x2=b.x-ux*rb, y2=b.y-uy*rb;
  const k=[e.from,e.to].sort().join("|");
  const n=pairCount[k], i=pairIndex[e.id];
  const bend = 0.14 + (n>1 ? (i-(n-1)/2)*0.21 : 0);
  const mx=(x1+x2)/2-(y2-y1)*bend, my=(y1+y2)/2+(x2-x1)*bend;
  return {x1,y1,x2,y2,mx,my,
    d:`M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
    // point at t=0.5 on the quadratic — badges sit exactly on the curve
    mid:{x:0.25*x1+0.5*mx+0.25*x2, y:0.25*y1+0.5*my+0.25*y2}};
}

  const G=GEOM[e.id];
  el("path",{class:"edge-hit",d:G.d},g);
  el("path",{class:"edge-line",d:G.d,stroke:STROKE[e.status],
    "stroke-width": e.kind==="value" ? 2.7 : 1.1,
    "stroke-dasharray": e.status==="formal" ? "5 4.5" : "none",
    "marker-end":`url(#a-${e.status})`,"stroke-linecap":"round"},g);
  g.addEventListener("click",()=>{if(clickBlocked())return;select("edge",e.id);});
  g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select("edge",e.id);}});
  g.addEventListener("mouseenter",()=>{state.hover={kind:"edge",id:e.id};paint();});
  g.addEventListener("mouseleave",()=>{state.hover=null;paint();});
});

/* --- contradiction badges --- */
CONTRADICTIONS.forEach(c=>{
  c.edges.forEach(eid=>{
    const G=GEOM[eid]; if(!G) return;
    const p=G.mid;
    const g=el("g",{class:"contra-badge","data-contra":c.id,"data-edge":eid,tabindex:"0",role:"button",
      "aria-label":`Gap ${c.id}: ${c.title}`},gBadges);
    el("path",{d:`M${p.x} ${p.y-8.5} L${p.x+8.5} ${p.y} L${p.x} ${p.y+8.5} L${p.x-8.5} ${p.y} Z`,
      fill:"var(--brass)",stroke:"var(--stage)","stroke-width":"1.3"},g);
    el("text",{x:p.x,y:p.y+3},g).textContent=c.id.slice(1);
    g.addEventListener("click",ev=>{ev.stopPropagation();if(clickBlocked())return;select("contra",c.id);});
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select("contra",c.id);}});
  });
});

/* --- nodes --- */
ACTORS.forEach(a=>{
  const g=el("g",{class:`node is-${a.type}`,"data-id":a.id,tabindex:"0",role:"button",
    "aria-label":`${a.label}, ${TYPES[a.type].label}`},gNodes);
  const r=radiusOf(a);
  if(a.status==="observed"){
    el("circle",{class:"node-halo",cx:a.x,cy:a.y,r:r+5.5,fill:"none",stroke:"var(--brass)","stroke-width":"1",opacity:".5"},g);
  }
  el("circle",{class:"node-dot",cx:a.x,cy:a.y,r,fill:TYPES[a.type].hex,
    stroke:"var(--stage)","stroke-width":a.type==="org"?2.5:1.8},g);
  const s=r*1.12;
  el("use",{class:"node-icon",href:"#sym-"+(a.ico||TYPES[a.type].icon),
    x:a.x-s/2,y:a.y-s/2,width:s,height:s,color:"var(--stage)",opacity:"0.92"},g);
  el("text",{class:"node-label",x:a.x,y:a.labelAbove ? a.y-r-8 : a.y+r+14},g).textContent=a.label;
  g.addEventListener("click",()=>{if(clickBlocked())return;select("node",a.id);});
  g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select("node",a.id);}});
  g.addEventListener("mouseenter",()=>{state.hover={kind:"node",id:a.id};paint();});
  g.addEventListener("mouseleave",()=>{state.hover=null;paint();});
});

/* ============================================================================
   ZOOM + PAN — wheel or pinch-trackpad to zoom about the cursor, drag to pan.
   The cement wall stays fixed; only the map moves over it.
   ==========================================================================*/
const VB={w:1240,h:920}, MINK=0.4, MAXK=5;
let view={k:1,x:0,y:0};
function applyView(){
  viewport.setAttribute("transform",`translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`);
}
function unitsPerPx(){
  const r=svg.getBoundingClientRect();
  return Math.min(r.width/VB.w, r.height/VB.h) || 1;
}
function viewBoxPoint(e){
  const r=svg.getBoundingClientRect(), s=unitsPerPx();
  // preserveAspectRatio="xMidYMid meet" centres the viewBox in the element
  return {x:(e.clientX-r.left-(r.width-VB.w*s)/2)/s,
          y:(e.clientY-r.top -(r.height-VB.h*s)/2)/s};
}
function zoomAbout(pt,factor){
  const k2=Math.min(MAXK,Math.max(MINK,view.k*factor));
  const f=k2/view.k;
  view.x=pt.x-(pt.x-view.x)*f;
  view.y=pt.y-(pt.y-view.y)*f;
  view.k=k2;
  applyView();
}
function resetView(){ view={k:1,x:0,y:0}; applyView(); }

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  zoomAbout(viewBoxPoint(e), Math.exp(-e.deltaY*0.0018));
},{passive:false});

let panning=false, panMoved=false, panLast=null, panEndedAt=0;
svg.addEventListener("pointerdown",e=>{
  if(e.button!==0) return;
  panning=true; panMoved=false; panLast={x:e.clientX,y:e.clientY};
});
window.addEventListener("pointermove",e=>{
  if(!panning) return;
  const dx=e.clientX-panLast.x, dy=e.clientY-panLast.y;
  if(!panMoved && Math.hypot(dx,dy)>4){ panMoved=true; svg.classList.add("grabbing"); }
  if(panMoved){
    const s=unitsPerPx();
    view.x+=dx/s; view.y+=dy/s;
    panLast={x:e.clientX,y:e.clientY};
    applyView();
  }
});
window.addEventListener("pointerup",()=>{
  if(panMoved) panEndedAt=Date.now();
  panning=false; panMoved=false; svg.classList.remove("grabbing");
});
// a drag that ends over a node must not also select it
function clickBlocked(){ return Date.now()-panEndedAt < 180; }

/* ========================================================================== */
function edgePasses(e){
  if(state.mode==="formal"   && e.status==="observed") return false;
  if(state.mode==="observed" && e.status==="formal")   return false;
  if(state.time!=="all" && e.time!=="all" && e.time!==state.time) return false;
  if(!state.types.has(byId[e.from].type) || !state.types.has(byId[e.to].type)) return false;
  return true;
}
function nodePasses(a){
  if(!state.types.has(a.type)) return false;
  if(state.mode==="formal"   && a.status==="observed") return false;
  if(state.mode==="observed" && a.status==="formal")   return false;
  if(state.time!=="all" && a.time!=="all" && a.time!==state.time) return false;
  return true;
}
function focusSets(){
  const sel=state.hover||state.selection;
  if(state.persona){
    const p=PERSONAS.find(x=>x.id===state.persona);
    // soft: a persona's route has to read *against* the rest of the system
    if(p) return {nodes:new Set(p.actors),edges:new Set(p.path),soft:true};
  }
  if(!sel) return null;
  if(sel.kind==="contra"){
    const c=contraById[sel.id]; const nodes=new Set(c.nodes);
    c.edges.forEach(id=>{const e=edgeById[id]; if(e){nodes.add(e.from);nodes.add(e.to);}});
    return {nodes,edges:new Set(c.edges),soft:false};
  }
  if(sel.kind==="edge"){
    const e=edgeById[sel.id];
    return {nodes:new Set([e.from,e.to]),edges:new Set([e.id]),soft:false};
  }
  if(sel.kind==="persona") return null;
  const nodes=new Set([sel.id]), edges=new Set();
  EXCHANGES.forEach(e=>{ if(e.from===sel.id||e.to===sel.id){edges.add(e.id);nodes.add(e.from);nodes.add(e.to);} });
  return {nodes,edges,soft:true};
}

function paint(){
  const focus=focusSets();
  let visible=0;
  gNodes.querySelectorAll(".node").forEach(g=>{
    const a=byId[g.dataset.id], pass=nodePasses(a);
    g.classList.toggle("hidden-el",!pass);
    g.setAttribute("tabindex",pass?"0":"-1");
    if(pass) visible++;
    g.classList.remove("dimmed","faded");
    if(pass&&focus&&!focus.nodes.has(a.id)) g.classList.add(focus.soft?"faded":"dimmed");
    const isSel=state.selection&&state.selection.kind==="node"&&state.selection.id===a.id;
    const dot=g.querySelector(".node-dot"), r=radiusOf(a);
    dot.setAttribute("r",r+(isSel?3:0));
    dot.setAttribute("stroke",isSel?"var(--brass)":"var(--stage)");
    dot.setAttribute("stroke-width",isSel?3:(a.type==="org"?2.5:1.8));
  });
  gEdges.querySelectorAll(".edge").forEach(g=>{
    const e=edgeById[g.dataset.id], pass=edgePasses(e);
    g.classList.toggle("hidden-el",!pass);
    g.setAttribute("tabindex",pass?"0":"-1");
    g.classList.remove("dimmed","faded");
    if(pass&&focus&&!focus.edges.has(e.id)) g.classList.add(focus.soft?"faded":"dimmed");
    const isSel=state.selection&&state.selection.kind==="edge"&&state.selection.id===e.id;
    const base=e.kind==="value"?2.7:1.1;
    g.querySelector(".edge-line").setAttribute("stroke-width",isSel?base+1.7:base);
  });
  gBadges.querySelectorAll(".contra-badge").forEach(g=>{
    const e=edgeById[g.dataset.edge], pass=edgePasses(e);
    g.classList.toggle("hidden-el",!pass);
    g.setAttribute("tabindex",pass?"0":"-1");
    g.classList.remove("dimmed","faded");
    if(pass&&focus&&!focus.edges.has(e.id)) g.classList.add(focus.soft?"faded":"dimmed");
  });
  document.getElementById("stageEmpty").style.opacity=visible?0:1;
}

/* ========================================================================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function swatch(a){
  return `<span class="sw" style="background:${TYPES[a.type].hex}">${icon(a.ico||TYPES[a.type].icon)}</span>`;
}
function evidenceBlock(ids){
  const seen=new Set();
  const rows=ids.filter(id=>{if(!EVIDENCE[id]||seen.has(id))return false;seen.add(id);return true;}).map(id=>{
    const e=EVIDENCE[id];
    return `<details class="ev"><summary><span class="ev-id">${esc(id)}</span><span class="ev-what">${esc(e.what)}</span></summary>
      <div class="ev-body"><p class="ev-quote">${esc(e.quote)}</p><p class="ev-src">${esc(e.src)} · ${esc(e.date)}</p></div></details>`;
  }).join("");
  return rows?`<div class="sec"><div class="sec-h">Evidence · click to open</div>${rows}</div>`:"";
}
function nodeLink(id,extra){
  const a=byId[id];
  return `<button data-node="${id}"><span class="gl" style="color:${TYPES[a.type].hex}">${icon(a.ico||TYPES[a.type].icon)}</span><span>${esc(a.label)}${extra||""}</span></button>`;
}
function edgeLink(e,dirText){
  return `<button data-edge="${e.id}"><span class="gl">${icon("arrowr")}</span><span>${esc(e.label)} <span style="color:var(--ink-3)">${dirText}</span></span></button>`;
}

function renderEmpty(){
  panelBody.innerHTML=`<div class="empty-panel">
    <p class="eh">Nothing selected</p>
    <p>Click an actor, a line, or a brass diamond. Scroll to zoom, drag to pan.</p>
    <p style="margin-top:12px">Switching <b>System view</b> from Published to Observed is the fastest way to see the argument: the kiosk, the table lights, the senior peer and the shouted call-out all appear, and none of them are named anywhere the shop publishes.</p>
    <div class="caveat"><b>Evidence base.</b> Three interviews (S1, S2 daytime and crossover staff; C1 daytime customer), one 5-hour observation (OB01, Sat 12 Sept 2026), and 39 coded secondary items. The survey was written but not fielded. No evening customer and no owner have been interviewed, so evening and management claims rest on observation and staff accounts. IDs follow the P3 repository index.</div>
  </div>`;
}

function renderNode(id){
  const a=byId[id];
  const out=EXCHANGES.filter(e=>e.from===id), inn=EXCHANGES.filter(e=>e.to===id);
  const gaps=CONTRADICTIONS.filter(c=>c.nodes.includes(id));
  panelBody.innerHTML=`
    <button class="iconbtn panel-close" data-close title="Close" aria-label="Close">${icon("close")}</button>
    <div class="panel-kicker">${swatch(a)}${esc(TYPES[a.type].label)}${a.status==="observed"?" · observed only":a.status==="formal"?" · published only":""}</div>
    <h2>${esc(a.label)}</h2>
    <p class="panel-lede">${esc(a.desc)}</p>
    <dl class="meta">
      <dt>In system</dt><dd>${a.status==="both"?"Published and observed":a.status==="observed"?"Observed only — named on no channel":"Published only"}</dd>
      <dt>Active</dt><dd>${a.time==="all"?"Throughout the day":a.time==="day"?"Daytime service":"Evening service"}</dd>
      <dt>Exchanges</dt><dd>${out.length} out, ${inn.length} in</dd>
    </dl>
    ${gaps.length?`<div class="sec">${gaps.map(c=>`<div class="contra-note"><div class="cn-h">${c.id} · ${esc(c.title)}</div><p>${esc(c.observed)}</p></div>`).join("")}</div>`:""}
    ${out.length?`<div class="sec"><div class="sec-h">Sends</div><div class="link-list">${out.map(e=>edgeLink(e,"to "+esc(byId[e.to].label))).join("")}</div></div>`:""}
    ${inn.length?`<div class="sec"><div class="sec-h">Receives</div><div class="link-list">${inn.map(e=>edgeLink(e,"from "+esc(byId[e.from].label))).join("")}</div></div>`:""}
    ${evidenceBlock(a.ev)}`;
}

function renderEdge(id){
  const e=edgeById[id], a=byId[e.from], b=byId[e.to];
  const c=e.contra?contraById[e.contra]:null;
  panelBody.innerHTML=`
    <button class="iconbtn panel-close" data-close title="Close" aria-label="Close">${icon("close")}</button>
    <div class="panel-kicker"><span class="sw" style="background:${STROKE[e.status]}"></span>${e.kind==="value"?"Value exchange":"Information exchange"}</div>
    <h2>${esc(a.label)} <span style="color:var(--ink-3);font-weight:400">→</span> ${esc(b.label)}</h2>
    <p class="panel-lede">${esc(e.label)}</p>
    <dl class="meta">
      <dt>Status</dt><dd>${e.status==="both"?"Published and observed":e.status==="observed"?"Observed only":"Published only"}</dd>
      <dt>Carries</dt><dd>${e.kind==="value"?"Value":"Information"}</dd>
      <dt>Active</dt><dd>${e.time==="all"?"Throughout the day":e.time==="day"?"Daytime service":"Evening service"}</dd>
    </dl>
    ${e.constraint?`<div class="sec"><div class="sec-h">Constraint</div><p class="constraint">${esc(e.constraint)}</p></div>`:""}
    ${c?`<div class="sec"><div class="contra-note"><div class="cn-h">${c.id} · ${esc(c.title)}</div><p>${esc(c.observed)}</p></div></div>`:""}
    <div class="sec"><div class="sec-h">Actors</div><div class="link-list">${nodeLink(a.id)}${nodeLink(b.id)}</div></div>
    ${evidenceBlock(e.ev)}`;
}

function renderContra(id){
  const c=contraById[id];
  const allEv=[...c.ev];
  c.edges.forEach(eid=>edgeById[eid]&&allEv.push(...edgeById[eid].ev));
  panelBody.innerHTML=`
    <button class="iconbtn panel-close" data-close title="Close" aria-label="Close">${icon("close")}</button>
    <div class="panel-kicker"><span class="sw" style="background:var(--brass)"></span>Gap ${c.id} · cluster ${esc(c.cluster)}</div>
    <h2>${esc(c.title)}</h2>
    <div class="sec"><div class="sec-h">The system as described</div><p class="panel-lede">${esc(c.formal)}</p></div>
    <div class="sec"><div class="sec-h">The system as it operates</div><div class="contra-note"><p>${esc(c.observed)}</p></div></div>
    <div class="sec"><div class="sec-h">Where it shows on the map</div><div class="link-list">${
      c.edges.map(eid=>{const e=edgeById[eid];return e?edgeLink(e,`${esc(byId[e.from].label)} → ${esc(byId[e.to].label)}`):"";}).join("")
      + c.nodes.map(nid=>nodeLink(nid)).join("")
    }</div></div>
    ${evidenceBlock(allEv)}`;
}

function renderPersona(pid){
  const p=PERSONAS.find(x=>x.id===pid);
  const row=(h,v)=>`<div class="sec"><div class="sec-h">${h}</div><p class="panel-lede">${esc(v)}</p></div>`;
  panelBody.innerHTML=`
    <button class="iconbtn panel-close" data-close title="Close" aria-label="Close">${icon("close")}</button>
    <div class="panel-kicker"><span class="sw" style="background:var(--c-customer)">${icon("person")}</span>Persona · placeholder</div>
    <h2>${esc(p.name)}</h2>
    <dl class="meta"><dt>Grounded in</dt><dd>${esc(p.basis)}</dd>
      <dt>Evidence</dt><dd><span class="strength s-${p.strength}">${p.strength}</span></dd></dl>
    ${row("Goal",p.goal)}${row("Context",p.context)}${row("Constraints",p.constraints)}
    ${row("Current behaviors",p.behaviors)}${row("Relationships that shape the service",p.relationships)}
    <div class="sec"><div class="sec-h">Why this persona</div><div class="contra-note"><p>${esc(p.divergence)}</p></div></div>
    <div class="sec"><div class="sec-h">Actors on their path</div><div class="link-list">${p.actors.map(n=>byId[n]?nodeLink(n):"").join("")}</div></div>
    ${evidenceBlock(p.ev)}
    <div class="caveat"><b>Placeholder.</b> Replace this entry in the <code style="font-family:'IBM Plex Mono',monospace">PERSONAS</code> array. Keep <code style="font-family:'IBM Plex Mono',monospace">actors</code> and <code style="font-family:'IBM Plex Mono',monospace">path</code> pointing at ids that exist on the map and the highlight keeps working.</div>`;
}

function select(kind,id){
  if(kind!=="persona"){ state.persona=null; syncPersona(); }
  if(state.selection&&state.selection.kind===kind&&state.selection.id===id&&kind!=="persona"){ clearSel(); return; }
  state.selection={kind,id};
  if(kind==="node") renderNode(id);
  else if(kind==="edge") renderEdge(id);
  else if(kind==="contra") renderContra(id);
  else if(kind==="persona") renderPersona(id);
  syncContra(); paint();
  document.getElementById("panel").scrollTop=0;
}
function clearSel(){ state.selection=null; state.persona=null; renderEmpty(); syncContra(); syncPersona(); paint(); }

/* ---------- controls ---------- */
[["resetBtn","reset"],["themeBtn","theme"],["zoomIn","plus"],["zoomOut","minus"],["zoomFit","fit"]]
  .forEach(([id,ic])=>{ document.getElementById(id).innerHTML=icon(ic); });
document.getElementById("zoomIn").addEventListener("click",()=>zoomAbout({x:VB.w/2,y:VB.h/2},1.32));
document.getElementById("zoomOut").addEventListener("click",()=>zoomAbout({x:VB.w/2,y:VB.h/2},1/1.32));
document.getElementById("zoomFit").addEventListener("click",resetView);

const typeChips=document.getElementById("typeChips");
Object.entries(TYPES).forEach(([key,t])=>{
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","true");
  b.style.setProperty("--sw",t.hex);
  b.innerHTML=`<span class="sw">${icon(t.icon)}</span>${t.label}`;
  b.addEventListener("click",()=>{
    state.types.has(key)?state.types.delete(key):state.types.add(key);
    b.setAttribute("aria-pressed",state.types.has(key)?"true":"false"); paint();
  });
  typeChips.appendChild(b);
});

const contraList=document.getElementById("contraList");
CONTRADICTIONS.forEach(c=>{
  const b=document.createElement("button");
  b.type="button"; b.dataset.contra=c.id; b.setAttribute("aria-pressed","false");
  b.innerHTML=`<span class="tag">${c.id}</span><span>${esc(c.title)}</span>`;
  b.addEventListener("click",()=>select("contra",c.id));
  contraList.appendChild(b);
});
function syncContra(){
  contraList.querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", state.selection&&state.selection.kind==="contra"&&state.selection.id===b.dataset.contra?"true":"false");
  });
}

const personaList=document.getElementById("personaList");
PERSONAS.forEach(p=>{
  const b=document.createElement("button");
  b.type="button"; b.className="persona-btn"; b.dataset.persona=p.id; b.setAttribute("aria-pressed","false");
  b.innerHTML=`<span><span class="pname">${esc(p.name)}</span><span class="pmeta">from ${esc(p.basis)}<span class="strength s-${p.strength}">${p.strength}</span></span></span>`;
  b.addEventListener("click",()=>{
    if(state.persona===p.id){clearSel();return;}
    state.persona=p.id; state.selection={kind:"persona",id:p.id};
    renderPersona(p.id); syncPersona(); syncContra(); paint();
    document.getElementById("panel").scrollTop=0;
  });
  personaList.appendChild(b);
});
function syncPersona(){
  personaList.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",state.persona===b.dataset.persona?"true":"false"));
}

document.getElementById("modeSeg").addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-mode]"); if(!b) return;
  state.mode=b.dataset.mode;
  ev.currentTarget.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  paint();
});
document.getElementById("timeSeg").addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-time]"); if(!b) return;
  state.time=b.dataset.time;
  ev.currentTarget.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  paint();
});
panelBody.addEventListener("click",ev=>{
  if(ev.target.closest("[data-close]")){clearSel();return;}
  const n=ev.target.closest("[data-node]"); if(n){select("node",n.dataset.node);return;}
  const e=ev.target.closest("[data-edge]"); if(e){select("edge",e.dataset.edge);return;}
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  state.mode="both"; state.time="all"; state.types=new Set(Object.keys(TYPES)); resetView();
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode==="both"?"true":"false"));
  document.querySelectorAll("#timeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.time==="all"?"true":"false"));
  typeChips.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","true"));
  clearSel();
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape") clearSel();});

applyView();
renderEmpty();
paint();
</script>
